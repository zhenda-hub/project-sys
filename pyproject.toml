[project]
name = "project-sys"
version = "0.1.0"
description = "A Django-based project management system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "asgiref>=3.7.2",
    "cffi>=1.15.1",
    "cryptography>=41.0.3",
    "defusedxml>=0.7.1",
    "diff-match-patch>=20230430",
    "Django>=4.2,<5",
    "django-admin-interface>=0.30.1",
    "django-ckeditor>=6.6.1",
    "django-ckeditor-5>=0.2.19",
    "django-colorfield>=0.14.0",
    "django-daisy>=1.0.26",
    "django-import-export>=4.0.7",
    "django-jazzmin>=3.0.1",
    "django-js-asset>=2.1.0",
    "django-markdownx>=4.0.2",
    "django-mdeditor>=0.1.20",
    "django-simpleui>=2025.5.262",
    "django-tinymce>=3.6.1",
    "django-vditor>=1.1.1",
    "docutils>=0.20.1",
    "gunicorn>=21.2.0",
    "Markdown>=3.4.3",
    "MarkupPy>=1.18",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.5",
    "Pillow>=10.0.0",
    "PyMySQL>=1.1.0",
    "python-dateutil>=2.9.0.post0",
    "python-slugify>=8.0.4",
    "pytz>=2025.2",
    "PyYAML>=6.0.2",
    "schedule>=1.1.0",
    "six>=1.17.0",
    "snowballstemmer>=2.2.0",
    "sqlparse>=0.4.4",
    "tablib>=3.5.0",
    "tabulate>=0.9.0",
    "text-unidecode>=1.3",
    "typing_extensions>=4.7.1",
    "tzdata>=2023.3",
    "ujson>=5.7.0",
    "urequests>=0.1.2",
    "whatthepatch>=1.0.4",
    "whitenoise>=6.6.0",
    "xlrd>=2.0.2",
    "xlwt>=1.3.0",
    "zipp>=3.16.2",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.0.0",
    "pycodestyle>=2.10.0",
    "pydocstyle>=6.2.3",
    "pyflakes>=3.0.1",
    "mccabe>=0.7.0",
]

[dependency-groups]
dev = [
    "flake8>=6.0.0",
    "pycodestyle>=2.10.0",
    "pydocstyle>=6.2.3",
    "pyflakes>=3.0.1",
    "mccabe>=0.7.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
